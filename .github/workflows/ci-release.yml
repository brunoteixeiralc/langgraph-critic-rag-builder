name: CI & Release

# Runs on every push to main: typecheck + the free/fast unit test suite
# (no API keys, no network calls — see tests/*.unit.test.ts and
# tests/edgeConditions.test.ts). test:integration (real OpenRouter LLM call)
# is intentionally excluded here to avoid a recurring cost on every commit —
# run it locally with `npm run test:integration` when you want that coverage.
#
# If the test job succeeds, the release job auto-bumps a semver tag based on
# Conventional Commits prefixes in the pushed commit messages (feat: -> minor,
# fix:/chore:/docs:/test:/etc. -> patch, "BREAKING CHANGE" -> major) and
# publishes a GitHub Release with auto-generated notes from the commits since
# the last release.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=24.10.0'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (free — no API keys, no network)
        run: npm run test:unit

  npm-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=24.10.0'
          cache: 'npm'

      - run: npm ci

      # Cross-checks installed dependencies against the npm/GitHub Advisory
      # Database for already-disclosed CVEs. audit-level=high so low/moderate
      # findings (often in dev-only tooling, frequently without a fix
      # available yet) don't block every release — high/critical is the bar
      # worth failing CI over.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit

      # Downloaded directly and checksum-verified rather than using the
      # gitleaks-action marketplace action — avoids depending on that
      # action's licensing terms and keeps this to a single pinned,
      # verified binary instead of another third-party Action to trust.
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan for committed secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v

  release:
    name: Tag & publish GitHub Release
    needs: [test, npm-audit, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history — needed to compute commits since the last tag

      # Both actions below run with `contents: write` (they push a tag and
      # publish a release). Pinned by commit SHA, not a movable tag — if
      # either project's tag were ever repointed (compromised maintainer
      # account), a tag-based reference would silently start running
      # different code with write access to this repo. Bump the SHA
      # deliberately when upgrading.
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true
