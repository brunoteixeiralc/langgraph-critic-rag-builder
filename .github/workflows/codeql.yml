name: CodeQL

# Static analysis (SAST) for the TS/JS source — catches classes of bugs
# pattern-matching/eslint won't, like SSRF (untrusted input reaching a
# fetch/request sink) or injection. Free for this repo since it's public;
# CodeQL's default analysis only requires GitHub Advanced Security (paid)
# on private repos.
#
# Runs on every push to main, every PR into main, and weekly on a schedule
# so newly-disclosed query patterns still get applied to code that hasn't
# changed recently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

permissions:
  contents: read
  security-events: write # required to upload results to the Security tab

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          languages: javascript-typescript

      # No build step needed — JS/TS is analyzed directly from source
      # (unlike compiled languages, which need an actual build to trace).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          category: "/language:javascript-typescript"
